<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <!-- Подключение Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>

</head>
<body>


<div class="container">

    <!-- ВСТАВКА МЕНЮ -->
    <div class="row">
        <h3 class="mx-3 my-3 text-center">Меню</h3>
        <div class="text-center">
            <a class="mt-4 mx-2 btn btn-outline-info" href="operation">Чтение всех (главная)</a>
            <a class="mt-4 mx-2 btn btn-outline-info" href="operation">Чтение одного</a>
            <a class="mt-4 mx-2 btn btn-outline-info" href="operation">Чтение фильтер</a>
        </div>
    </div>

    <!-- ВСТАВКА ФОРМЫ -->
    <div class="row">
        <div class="col-3"></div>
        <div class="col-6">

            <!-- ВСТАВКА ФОРМЫ ИЗ FORMS.PY -->
            <form class="rom g-2 pt-5 pb-5" method="POST">
                {% csrf_token %} <!-- ЗАЩИТА ФОРМЫ -->
                <div class="mb-3"><label class="form-label">{{ FORM.pk.label }}</label>{{ FORM.pk }}</div>
                <div class="mb-3"><label class="form-label">{{ FORM.name.label }}</label>{{ FORM.name }}</div>
                <div class="mb-3"><label class="form-label">{{ FORM.age.label }}</label>{{ FORM.age }}</div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-danger mt-3">Отправить</button>
                </div> <!-- КНОПКА ФОРМЫ -->
            </form>

        </div>
        <div class="col-3"></div>
    </div>

    <!-- ВСТАВКА ТАБЛИЦЫ -->
    <div class="row">
        <div class="col-2"></div>
        <div class="col-8">

            <!-- ВСТАВКА ТАБЛИЦЫ -->
            <h3 class="mx-3 my-3 text-center">Вывод Результата из БД</h3>
            <table class="table table-dark">
                <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Имя</th>
                    <th scope="col">Фамилия</th>
                    <th scope="col">Обращение</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <th scope="row">1</th>
                    <td>Mark</td>
                    <td>Otto</td>
                    <td>@mdo</td>
                </tr>
                <tr>
                    <th scope="row">2</th>
                    <td>Jacob</td>
                    <td>Thornton</td>
                    <td>@fat</td>
                </tr>
                <tr>
                    <th scope="row">3</th>
                    <td colspan="2">Larry the Bird</td>
                    <td>@twitter</td>
                </tr>
                </tbody>
            </table>

        </div>
        <div class="col-2"></div>
    </div>

</div>

</body>
</html>
